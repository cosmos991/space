<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080e15"><meta name="description" content="아스테리온 항성계에서 시작하는 자유 항해. 함교 지휘형 우주 시뮬레이션."><title>ASTERION · 함교 지휘 시스템</title><link rel="stylesheet" href="/style.css"></head>
<body>
<div class="shell">
 <aside class="rail"><a class="brand" href="#" data-home aria-label="아스테리온 함교">A<span>✦</span></a><span class="rail-label">BRIDGE OS</span>
 <nav id="nav" aria-label="함교 메뉴">
  <button data-home class="active" aria-label="항성계 지도" title="항성계 지도"><span>⌖</span><small>항성계</small></button>
  <button data-tab="market" aria-haspopup="dialog" aria-controls="workspace-panel" aria-label="거래소" title="거래소"><span>⇄</span><small>거래소</small></button>
  <button data-tab="comms" aria-haspopup="dialog" aria-controls="workspace-panel" aria-label="세력 통신" title="세력 통신"><span>◉</span><small>통신</small></button>
  <button data-tab="factions" aria-haspopup="dialog" aria-controls="workspace-panel" aria-label="주요 팩션" title="주요 팩션"><span>⚑</span><small>팩션</small></button>
  <button data-tab="galaxy" aria-haspopup="dialog" aria-controls="workspace-panel" aria-label="성간 탐색"><span>✧</span><small>성간</small></button>
  <button data-tab="missions" aria-label="세력 임무"><span>◇</span><small>임무</small></button>
  <button data-tab="news" aria-label="성계 소식"><span>≡</span><small>정보</small></button>
 </nav><button id="help" title="함장 안내" aria-label="함장 안내">?</button><div class="rail-bottom">V.02<br>BRIDGE</div></aside>
 <main class="workspace">
  <header><div class="wordmark">ASTERION <small>FREE CAPTAIN INITIATIVE</small></div><div class="connection"><i></i> CSV 노마드 · 연결 정상</div><div id="clock"></div><span id="save-status" role="status">기기 자동 저장</span><button id="save" class="quiet">저장</button><button id="load" class="quiet">불러오기</button></header>
  <section id="region-news" class="region-news" aria-label="지역별 주요 소식"></section>
  <section id="stats" class="stats" aria-label="핵심 함선 현황"></section>
  <div class="bridge-heading"><div><div class="eyebrow">COMMAND DECK / SECTOR 01</div><h1>아스테리온 항성계<span>.</span></h1></div><button id="current-location-button" data-current-location class="quiet" aria-haspopup="dialog">현재 구역 행동 ↗</button></div>
  <section class="panel system-panel" aria-label="항성계 항법">
   <div class="map-wrap"><svg id="system-map" viewBox="0 0 800 530" role="group" aria-label="목적지를 선택할 수 있는 아스테리온 항성계 지도"></svg><div class="map-legend"><span><i class="cyan"></i> 연합 관할</span><span><i class="amber"></i> 기업 구역</span><span><i class="purple"></i> 미탐사</span></div><div class="map-coordinate mono">LOCAL SECTOR / 8 DESTINATIONS<br>목적지를 선택하면 항법 패널이 열립니다</div></div>
   <div class="bridge-controls"><div id="travel" class="travel"></div><div class="time-controls"><div><span class="status-dot"></span><span id="sim-status">시뮬레이션 정지</span></div><div id="speeds"><button data-speed="0" class="active" aria-label="일시정지">Ⅱ</button><button data-speed="1">1×</button><button data-speed="4">4×</button><button data-speed="12">12×</button></div></div></div>
  </section>
  <button id="bridge-alert" class="bridge-alert" data-tab="navigation" hidden></button>
  <button id="captain-pad" data-data-section="home" aria-haspopup="dialog" aria-controls="workspace-panel"><span>▤</span> 함장 데이터 <small>함선 · 선원 · 자산</small><span>⌃</span></button>
  <footer><span><i class="status-dot"></i> ASTERION BRIDGE SYSTEM <b>02.0</b></span><span>왼쪽은 항해 업무 · 아래는 함장 데이터</span><button id="reset" class="quiet">새 항해</button></footer>
 </main>
</div>
<dialog id="workspace-panel" aria-labelledby="panel-title"><div class="workspace-panel-head"><div><div id="panel-kicker" class="eyebrow"></div><h2 id="panel-title"></h2></div><button id="close-panel" aria-label="패널 닫기" autofocus>✕ <span>ESC</span></button></div><nav id="panel-nav" aria-label="항해 업무"><button data-tab="navigation">항법</button><button data-tab="galaxy">성간 탐색</button><button data-tab="market">거래소</button><button data-tab="comms">통신</button><button data-tab="factions">팩션</button><button data-tab="missions">임무</button><button data-tab="news">정보</button><button id="combat-tab" data-tab="combat" hidden>전투</button></nav><div id="detail"></div><div class="workspace-panel-foot"><span>CSV NOMAD / COMMAND INTERFACE</span><button data-close-panel>항성계로 돌아가기 ↗</button></div></dialog>
<div id="toast" role="status" aria-live="polite"></div><dialog id="modal"></dialog>
<script type="module" src="/app.js"></script>
</body></html>
